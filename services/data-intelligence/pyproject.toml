[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civicbridge-data-intelligence"
version = "1.0.0"
description = "Geospatial enrichment, clustering, hotspot scoring, and evidence service for CivicBridge"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
  "google-genai>=1.47,<2",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-cov>=5,<7"]
google-data = ["google-cloud-bigquery>=3.25,<4"]
google-events = ["google-cloud-pubsub>=2.23,<3"]
production = ["google-cloud-bigquery>=3.25,<4", "google-cloud-pubsub>=2.23,<3"]

[project.scripts]
civicbridge-ingest-official = "app.adapters.bigquery.ingest:main"
civicbridge-embedding-smoke = "app.adapters.similarity.smoke:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
