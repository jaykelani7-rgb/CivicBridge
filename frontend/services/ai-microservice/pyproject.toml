[project]
name = "resourcematch-ai-microservice"
version = "0.1.0"
description = "FastAPI microservice for ResourceMatch OCR, voice intake, NLP extraction, and heat decay processing."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[tool.uv]
package = false
